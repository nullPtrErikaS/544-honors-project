[project]
name = "mapreduce"
version = "0.1.0"
description = "A small MapReduce implementation that runs on Docker Compose"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md", "mapreduce/mr_pb2.py", "mapreduce/mr_pb2_grpc.py", "mapreduce/mr_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
